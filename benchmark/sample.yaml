sample:
  description: Benchmark sample
  name: benchmark sample
common:
  tags: benchmark
tests:
  bench.dhry:
    harness: robot
    harness_config:
      robot_testsuite: bench.robot
  bench.dhry.instr:
    harness: robot
    harness_config:
      robot_testsuite: bench.robot
    extra_args: EXTRA_CONF_FILE=instr_tracing.conf
    extra_configs:
      - CONFIG_ZPL_BENCHMARK_RUN_DHRYSTONE=y
  bench.dhry.tracing:
    harness: robot
    harness_config:
      robot_testsuite: bench.robot
    extra_args: EXTRA_CONF_FILE=tracing.conf
    extra_configs:
      - CONFIG_ZPL_BENCHMARK_RUN_DHRYSTONE=y
  bench.dhry.zpl:
    harness: robot
    harness_config:
      robot_testsuite: bench.robot
    extra_args: EXTRA_CONF_FILE=zpl.conf
    extra_configs:
      - CONFIG_ZPL_BENCHMARK_RUN_DHRYSTONE=y

  bench.basic:
    harness: robot
    harness_config:
      robot_testsuite: bench.robot
    extra_configs:
      - CONFIG_ZPL_BENCHMARK_RUN_BASIC=y
  bench.basic.instr:
    harness: robot
    harness_config:
      robot_testsuite: bench.robot
    extra_args: EXTRA_CONF_FILE=instr_tracing.conf
    extra_configs:
      - CONFIG_ZPL_BENCHMARK_RUN_BASIC=y
  bench.basic.tracing:
    harness: robot
    harness_config:
      robot_testsuite: bench.robot
    extra_args: EXTRA_CONF_FILE=tracing.conf
    extra_configs:
      - CONFIG_ZPL_BENCHMARK_RUN_BASIC=y
  bench.basic.zpl:
    harness: robot
    harness_config:
      robot_testsuite: bench.robot
    extra_args: EXTRA_CONF_FILE=zpl.conf
    extra_configs:
      - CONFIG_ZPL_BENCHMARK_RUN_BASIC=y

  bench.threads:
    harness: robot
    harness_config:
      robot_testsuite: bench.robot
    extra_configs:
      - CONFIG_ZPL_BENCHMARK_RUN_THREADS=y
  bench.threads.tracing:
    harness: robot
    harness_config:
      robot_testsuite: bench.robot
    extra_args: EXTRA_CONF_FILE=tracing.conf
    extra_configs:
      - CONFIG_ZPL_BENCHMARK_RUN_THREADS=y

  bench.tflite:
    harness: robot
    harness_config:
      robot_testsuite: bench.robot
    extra_args: EXTRA_CONF_FILE=tflite.conf
    extra_configs:
      - CONFIG_ZPL_BENCHMARK_RUN_TFLITE=y
  bench.tflite.zpl:
    harness: robot
    harness_config:
      robot_testsuite: bench.robot
    extra_args: EXTRA_CONF_FILE=tflite.conf;zpl.conf
    extra_configs:
      - CONFIG_ZPL_BENCHMARK_RUN_TFLITE=y
  bench.tflite.tracing:
    harness: robot
    harness_config:
      robot_testsuite: bench.robot
    extra_args: EXTRA_CONF_FILE=tflite.conf;tracing.conf
    extra_configs:
      - CONFIG_ZPL_BENCHMARK_RUN_TFLITE=y
