sample:
  description: Hello World TensorFlow instrumentation sample
  name: hello world tensorflow instrumentation
common:
  tags: tensorflow profiling
  platform_exclude:
    - mpfs_icicle/polarfire/u54/smp
  modules:
    - tflite-micro
tests:
  sample.tensorflow.helloworld:
    harness: console
    harness_config:
      type: multi_line
      ordered: false
      regex:
        - "x_value:.*, y_value:.*"
        - ""
  sample.tensorflow.helloworld.instrumentation.robot:
    harness: robot
    harness_config:
      robot_testsuite: instrumentation.robot
  sample.tensorflow.helloworld.instrumentation_zpl.robot:
    min_ram: 100
    extra_args: EXTRA_CONF_FILE=zpl.conf
    harness: robot
    harness_config:
      robot_testsuite: instrumentation.robot
