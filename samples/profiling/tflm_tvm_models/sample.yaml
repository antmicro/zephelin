sample:
  name: tflm_tvm_models
common:
  tags: profiling
  platform_exclude:
    - mpfs_icicle/polarfire/u54/smp
tests:
  sample.profiling.tflm_tvm_models.plaintext.robot:
    harness: robot
    harness_config:
      robot_testsuite: tflm_tvm_models_plaintext.robot
  sample.profiling.tflm_tvm_models.ctf.robot:
    extra_configs:
      - CONFIG_ZPL_TRACE_FORMAT_CTF=y
      - CONFIG_BOOT_BANNER=n
      - CONFIG_PRINTK=n
      - CONFIG_LOG=n
    harness: robot
    harness_config:
      robot_testsuite: tflm_tvm_models_ctf.robot
