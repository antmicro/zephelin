CONFIG_INSTRUMENTATION=y
CONFIG_TRACING=y
CONFIG_TRACING_CTF=y

CONFIG_ZPL_SAMPLE_TFLM_MODEL="sine"
CONFIG_ZPL_SAMPLE_TFLM_BUFFER_SIZE=8

CONFIG_MAIN_STACK_SIZE=3072

CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FLOAT_PRINTF=y

CONFIG_INSTRUMENTATION_BACKEND_TRACING_CORE=y

CONFIG_THREAD_NAME=y
CONFIG_THREAD_MAX_NAME_LEN=20

CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=n
CONFIG_ZPL_TRACE_FORMAT_CTF=y
CONFIG_ZPL_RUNTIME_CONFIG_UART=y
