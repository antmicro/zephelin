sample:
  name: custom_clock
common:
  tags: basic
  platform_exclude:
    - mpfs_icicle/polarfire/u54/smp
tests:
  sample.trace.custom_clock.timings.robot:
    harness: robot
    harness_config:
      robot_testsuite: custom_clock_simple.robot
    extra_configs:
      - CONFIG_ZPL_SCOPE_MARKING=y
      - CONFIG_PRINTK=n
      - CONFIG_TIMING_FUNCTIONS=y
  sample.trace.custom_clock.sensor_clock_system.robot:
    harness: robot
    harness_config:
      robot_testsuite: custom_clock_simple.robot
    extra_configs:
      - CONFIG_ZPL_SCOPE_MARKING=y
      - CONFIG_PRINTK=n
      - CONFIG_SENSOR=y
      - CONFIG_SENSOR_ASYNC_API=y
      - CONFIG_SENSOR_CLOCK_SYSTEM=y
  sample.trace.custom_clock.sensor_clock_counter.robot:
    harness: robot
    harness_config:
      robot_testsuite: custom_clock_simple.robot
    platform_allow:
      - stm32f429i_disc1/stm32f429xx
      - max32650fthr
    extra_configs:
      - CONFIG_ZPL_SCOPE_MARKING=y
      - CONFIG_PRINTK=n
      - CONFIG_SENSOR=y
      - CONFIG_COUNTER=y
      - CONFIG_SENSOR_ASYNC_API=y
      - CONFIG_SENSOR_CLOCK_COUNTER=y
  sample.trace.custom_clock.zephyr_events.robot:
    harness: robot
    harness_config:
      robot_testsuite: custom_clock_zephyr_events.robot
    extra_configs:
      - CONFIG_ZPL_SCOPE_MARKING=y
      - CONFIG_ZPL_MEMORY_PROFILING=y
      - CONFIG_ZPL_MEMORY_PROFILING_INTERVAL=10
      - CONFIG_ZPL_MEMORY_PROFILING_THREAD_PRIORITY=-1
      - CONFIG_PRINTK=n
  sample.trace.custom_clock.instrumentation.robot:
    harness: robot
    harness_config:
      robot_testsuite: custom_clock_instrumentation.robot
    extra_configs:
      - CONFIG_ZPL_INSTRUMENTATION=y
      - CONFIG_PRINTK=y
      - CONFIG_INSTRUMENTATION_DYNAMIC_TRIGGER=n
      - CONFIG_INSTRUMENTATION_TRIGGER_FUNCTION="nested1"
      - CONFIG_INSTRUMENTATION_STOPPER_FUNCTION="nested1"
